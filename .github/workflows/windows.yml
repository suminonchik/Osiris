name: Windows

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Osiris x86
      run: msbuild Osiris.sln /p:Configuration=Release /p:Platform=x86

    - name: Upload Osiris DLL
      uses: actions/upload-artifact@v4
      with:
        name: Osiris-CSGO-x86
        path: |
          Release/Osiris.dll
          bin/Release/Osiris.dll
